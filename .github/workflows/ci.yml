
name: Tests and Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write

    env:
      SUPABASE_URL: ""
      SUPABASE_SECRET_KEY: ""
      SUPABASE_DB_URL: ""
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/packconnect_test?sslmode=disable

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: packconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies and coverage
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install coverage

      - name: Run backend tests with coverage
        run: |
          python -m coverage run --source=backend -m unittest discover -s backend -p "test_*.py" -v
          python -m coverage report -m
          python -m coverage xml -o coverage.xml

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: error
      - name: Upload coverage to Codecov
        if: ${{ vars.CODECOV_ENABLED == 'true' }}
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          use_oidc: true
          fail_ci_if_error: true

  m0-eval:
    name: M0 matching evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL: ""
      SUPABASE_SECRET_KEY: ""
      SUPABASE_DB_URL: ""
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/packconnect_test?sslmode=disable
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: packconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Cache fastembed model
        uses: actions/cache@v4
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          key: fastembed-BAAI-bge-small-en-v1.5

      - name: Run eval tests
        run: python -m unittest discover -s eval -p "test_*.py"

      - name: Generate synthetic eval data
        run: |
          python eval/generate.py --seed 1 --out eval/data/seed1.json
          python eval/generate.py --seed 2 --out eval/data/seed2.json

      - name: Run M0 evaluation (reports claims; fails only if the script crashes)
        run: python eval/run_m0.py --tune eval/data/seed1.json

  frontend:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend interaction tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build
