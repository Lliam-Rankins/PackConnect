name: Q&A browser regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Q&A real-browser flow
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/packconnect_browser_test?sslmode=disable
      E2E_PYTHON: python
      PLAYWRIGHT_BROWSERS_PATH: /tmp/packconnect-playwright-browsers
      SUPABASE_URL: ""
      SUPABASE_SECRET_KEY: ""
      SUPABASE_DB_URL: ""
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: packconnect_browser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install API and browser test dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          npm ci --prefix frontend
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run the real browser and database workflow
        working-directory: frontend
        run: npm run test:e2e
      - name: Save browser report and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-browser-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
