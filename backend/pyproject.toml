[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RudrakshNanavaty", email = "rudrakshnanavaty@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1,<4",
    "flask-cors>=6,<7",
    "psycopg[binary,pool]>=3.2,<4",
    "python-dotenv>=1,<2",
    "supabase>=2,<3",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
